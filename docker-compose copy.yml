services:
  nextjs:
    image: node:20-alpine
    container_name: dashboard
    working_dir: /app
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
    command: sh -c "npm install && npm run dev"



    